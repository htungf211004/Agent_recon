    purpose: Discover scoped TCP services with durable evidence
    applicable_when: capability_authorized
    recommended_capabilities: [nmap_scan]
    required_capabilities: [nmap_scan]
    risk: R1
    safe_default: true
    evidence_requirement: verified_terminal_evidence
    status_rule: capability
    source_reference: PT_01_Checklist_Pentest_Web.docx; group 1; STT 2 (Active Recon); bounded subset
