- knowledge_id: RECON-AS-SCOPE-01
  namespace: attack_surface_methodology
  title: Scope seed
  category: scope_seed
  asset_types:
  - HOST
  - IP
  - SERVICE
  - PATH
  - API
  - DOCUMENT
  capabilities:
  - dns_resolve
  risk: R0
  delivery: AUTOMATIC
  requires:
  - operator_authorized_scope
  - operator_authorized_root_and_scope_version
  produces: &id001
  - DiscoveredAsset
  api_related: false
  content:
    objective: Complete the bounded scope seed inventory step, retaining limitations.
    applies_when:
    - The authorized inventory has an unresolved scope_seed coverage gap and the required
      inputs exist.
    safe_actions:
    - Canonicalize the operator root, host or IP, scheme, port and path prefix using
      the existing scope contracts; persist the frozen authorization version. Candidate
      relations grant no authorization.
    expected_observations: *id001
    evidence_required:
    - tool_output with gateway evidence_ref, origin or input identity, timestamp and
      integrity.
    follow_up:
    - Submit candidates to existing scope admission and policy; knowledge grants no
      authority.
    completion_rule: All authorized seeds have canonical identities and frozen scope
      bindings, or a normalization limitation is recorded.
  source_paths:
  - src/recon/scope/models.py
  - src/recon/capability_catalog.py
  - src/recon/checklist_v3.py
