name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Require usable Chromium runtime
        run: python -m src.recon.browser_runtime --probe

      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/check_recon_runtime.py scripts/check_recon_v3_runtime.py scripts/install_recon_tools.py scripts/resolve_recon_tool_lock.py scripts/run_recon_live.py scripts/recon_ui.py

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          RECON_REQUIRE_CHROMIUM: "1"

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Chromium runtime
        run: docker build -t agent-recon-final .
      - name: Require Chromium as non-root container user
        run: |
          docker run --rm agent-recon-final python -c "import os; assert os.getuid() != 0"
          docker run --rm agent-recon-final python -m src.recon.browser_runtime --probe
      - name: Require Nmap, WhatWeb and pinned FFUF binaries
        run: |
          docker run --rm agent-recon-final nmap --version
          docker run --rm agent-recon-final whatweb --version
          docker run --rm agent-recon-final ffuf -V
      - name: Require V3 capability manifest and real localhost adapter execution
        run: docker run --rm --network none -e RECON_REQUIRE_V3_RUNTIME=1 agent-recon-final python -m scripts.check_recon_runtime
      - name: Check default FastAPI startup
        run: |
          docker run --detach --name recon-final-smoke -e APP_ENV=test agent-recon-final
          trap 'docker rm -f recon-final-smoke' EXIT
          for attempt in $(seq 1 30); do
            if docker exec recon-final-smoke python -c "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2))['status'] == 'ok'"; then
              exit 0
            fi
            sleep 1
          done
          docker logs recon-final-smoke
          exit 1
